<html>
<head>
<title>Mouse Over Event</title>
<style>
body {
    text-align: center;
    font-family: Arial;
    padding-top: 50px;
}
img {
    width: 300px;
    height: 250px;
    border-radius: 10px;
}
h2 {
    color: purple;
}
</style>
</head>
<body>
<h2>Mouse Over Event</h2>

<img id="pic" src="/home/ksb/niranjana/image1.jpg"
     onmouseover="changeContent()"
     onmouseout="changeBack()">

<p id="msg">Move mouse</p>

<script>
function changeContent() {
    document.getElementById("pic").src = "/home/ksb/niranjana/image2.jpeg";
    document.getElementById("msg").innerHTML = "KMCT College";
}

function changeBack() {
    document.getElementById("pic").src = "/home/ksb/niranjana/image1.jpg";
    document.getElementById("msg").innerHTML = "Move mouse";
}
</script>
</body>
</html>
